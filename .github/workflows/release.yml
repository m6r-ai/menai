name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishing (OIDC)

jobs:
  build-wheels:
    name: Build wheel (${{ matrix.os-label }} Python ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - runner: ubuntu-latest
            python: "3.14"
            cp-tag: cp314
            os-label: linux-x86_64
          - runner: ubuntu-latest
            python: "3.13"
            cp-tag: cp313
            os-label: linux-x86_64
          - runner: ubuntu-latest
            python: "3.12"
            cp-tag: cp312
            os-label: linux-x86_64
          - runner: ubuntu-latest
            python: "3.11"
            cp-tag: cp311
            os-label: linux-x86_64
          - runner: ubuntu-latest
            python: "3.10"
            cp-tag: cp310
            os-label: linux-x86_64
          # Linux ARM64
          - runner: ubuntu-24.04-arm
            python: "3.14"
            cp-tag: cp314
            os-label: linux-arm64
          - runner: ubuntu-24.04-arm
            python: "3.13"
            cp-tag: cp313
            os-label: linux-arm64
          - runner: ubuntu-24.04-arm
            python: "3.12"
            cp-tag: cp312
            os-label: linux-arm64
          - runner: ubuntu-24.04-arm
            python: "3.11"
            cp-tag: cp311
            os-label: linux-arm64
          - runner: ubuntu-24.04-arm
            python: "3.10"
            cp-tag: cp310
            os-label: linux-arm64
          # macOS ARM64 (Apple Silicon)
          - runner: macos-latest
            python: "3.14"
            cp-tag: cp314
            os-label: macos-arm64
          - runner: macos-latest
            python: "3.13"
            cp-tag: cp313
            os-label: macos-arm64
          - runner: macos-latest
            python: "3.12"
            cp-tag: cp312
            os-label: macos-arm64
          - runner: macos-latest
            python: "3.11"
            cp-tag: cp311
            os-label: macos-arm64
          - runner: macos-latest
            python: "3.10"
            cp-tag: cp310
            os-label: macos-arm64
          # macOS x86_64 (Intel)
          - runner: macos-15-intel
            python: "3.14"
            cp-tag: cp314
            os-label: macos-x86_64
          - runner: macos-15-intel
            python: "3.13"
            cp-tag: cp313
            os-label: macos-x86_64
          - runner: macos-15-intel
            python: "3.12"
            cp-tag: cp312
            os-label: macos-x86_64
          - runner: macos-15-intel
            python: "3.11"
            cp-tag: cp311
            os-label: macos-x86_64
          - runner: macos-15-intel
            python: "3.10"
            cp-tag: cp310
            os-label: macos-x86_64
          # Windows x86_64
          - runner: windows-latest
            python: "3.14"
            cp-tag: cp314
            os-label: windows-x86_64
          - runner: windows-latest
            python: "3.13"
            cp-tag: cp313
            os-label: windows-x86_64
          - runner: windows-latest
            python: "3.12"
            cp-tag: cp312
            os-label: windows-x86_64
          - runner: windows-latest
            python: "3.11"
            cp-tag: cp311
            os-label: windows-x86_64
          - runner: windows-latest
            python: "3.10"
            cp-tag: cp310
            os-label: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheel
        env:
          CIBW_BUILD: ${{ matrix.cp-tag }}-*
          CIBW_ARCHS: all
          CIBW_SKIP: "*-musllinux*"
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os-label }}-py${{ matrix.python }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: python -m pip install build && python -m build --sdist --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test-wheels:
    name: Test wheel (${{ matrix.runner }} Python ${{ matrix.python }})
    needs: [build-wheels]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python: "3.12"
          - runner: macos-latest
            python: "3.12"
          - runner: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*-${{ matrix.python }}
          merge-multiple: true
          path: wheelhouse

      - name: Install wheel
        run: pip install --no-index --find-links wheelhouse menai

      - name: Verify C VM import
        shell: python
        run: |
          from menai.vm.menai_vm_c import execute
          print('C VM OK')

      - name: Run tests
        run: |
          pip install pytest pytest-cov pylint
          python -m pytest tests/ -x -q

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-wheels]
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1